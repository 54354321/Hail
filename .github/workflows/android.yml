name: Android CI

on:
  push:
    branches: [main, graupel]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
